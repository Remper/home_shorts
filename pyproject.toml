[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shortlinks"
dynamic = ["version"]
description = "A small self-hosted short-link redirect service with a REST API and an MCP endpoint"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.scripts]
shortlinks = "shortlinks.cli:main"

[tool.hatch.version]
path = "src/shortlinks/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/shortlinks"]

[tool.ruff]
line-length = 110
target-version = "py311"
